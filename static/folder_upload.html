<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Folder — Alhudha Admin</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f1f5f9; padding: 16px; color: #0f172a; min-height: 100vh; margin: 0; }
  .card { max-width: 520px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h2 { margin-top: 0; color: #1e3a8a; font-size: 20px; }
  p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
  input[type="file"] { display: block; width: 100%; padding: 12px; border: 2px dashed #cbd5e1; border-radius: 10px; margin-bottom: 20px; background: #f8fafc; cursor: pointer; }
  input[type="file"]:active { border-color: #2563eb; background: #eff6ff; }
  button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  
  /* Added style for the close button */
  #close-btn { background: #059669; display: none; margin-top: 12px; }
  button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  #folder-input:disabled { opacity: 0.65; }
  #close-btn:hover { background: #047857; }
  
  #status { margin-top: 20px; font-weight: bold; text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; }
  .success { background: #d1fae5; color: #065f46; }
  .error { background: #fee2e2; color: #991b1b; }
  .info { background: #e0f2fe; color: #0369a1; }
</style>
</head>
<body>
  <div class="card">
    <h2>📁 Upload Traveler Folder</h2>
    <p id="target-info">Select a folder to upload.</p>
    
    <input type="file" id="folder-input" webkitdirectory directory multiple>
    <button id="upload-btn" onclick="upload()">Upload Folder</button>
    
    <!-- NEW: Close Button -->
    <button id="close-btn" onclick="closeWindow()">Close Window</button>
    
    <div id="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const travelerId = (params.get('traveler_id') || '').trim();
    const token = (params.get('token') || '').trim();
    const MAX_FILES = 100;
    const MAX_TOTAL_BYTES = 500 * 1024 * 1024;

    if (travelerId) {
      const info = document.getElementById('target-info');
      info.textContent = '';
      const strong = document.createElement('b');
      strong.textContent = 'Target Traveler: ' + travelerId;
      info.appendChild(strong);
      info.appendChild(document.createElement('br'));
      info.appendChild(document.createTextNode("Select the folder containing this traveler's files."));
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.className = type || 'info';
      status.textContent = message;
    }

    async function upload() {
      const input = document.getElementById('folder-input');
      const btn = document.getElementById('upload-btn');
      const status = document.getElementById('status');
      const closeBtn = document.getElementById('close-btn');
      
      if (!input.files.length) {
        showStatus('Please select a folder first.', 'error');
        return;
      }
      if (input.files.length > MAX_FILES) {
        showStatus('Too many files. Select no more than ' + MAX_FILES + '.', 'error');
        return;
      }
      let totalBytes = 0;
      for (const file of input.files) totalBytes += file.size || 0;
      if (totalBytes > MAX_TOTAL_BYTES) {
        showStatus('Folder is too large. Maximum total size is 500 MB.', 'error');
        return;
      }
      if (!token) {
        showStatus('Missing admin token. Reopen this page from the admin panel.', 'error');
        return;
      }

      btn.disabled = true;
      input.disabled = true;
      status.className = 'info';
      status.textContent = '⏳ Uploading... Please wait.';
      
      const fd = new FormData();
      if (travelerId) fd.append('traveler_id', travelerId);
      
      for (const file of input.files) {
        fd.append('files', file);
        fd.append('paths', file.webkitRelativePath);
      }
      
      try {
        const res = await fetch('/api/admin/traveler/upload-folder-html', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          credentials: 'include',
          body: fd
        });

        let data = null;
        try { data = await res.json(); } catch (e) {}
        if (res.ok && data && data.success === true) {
          status.className = 'success';
          status.textContent = '✅ Upload successful! Uploaded ' +
            String(data.count || 0) + ' files to ' + String(data.folder || '') + '.';
          
          // Hide the upload button and show the close button
          btn.style.display = 'none';
          closeBtn.style.display = 'block';
          
        } else {
          const err = data && (data.detail || data.message)
            ? (data.detail || data.message) : 'HTTP ' + res.status;
          status.className = 'error';
          status.textContent = '❌ Upload failed: ' + String(err).slice(0, 240);
          btn.disabled = false;
          input.disabled = false;
        }
      } catch (e) {
        status.className = 'error';
        status.textContent = '❌ Network error: ' + (e.message || 'Request failed');
        btn.disabled = false;
        input.disabled = false;
      }
    }

    // Function to close the tab
    function closeWindow() {
      // Try to close the current tab
      window.close();
      
      // Fallback: If the browser blocks window.close() (because it wasn't opened via script),
      // show a message so the user knows to close it manually.
      setTimeout(() => {
        const status = document.getElementById('status');
        status.className = 'success';
        status.textContent = 'Upload page finished. Please close this tab manually.';
      }, 300);
    }
  </script>
</body>
</html>
