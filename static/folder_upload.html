<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Folder — Alhudha Admin</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f1f5f9; padding: 16px; color: #0f172a; min-height: 100vh; margin: 0; }
  .card { max-width: 520px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h2 { margin-top: 0; color: #1e3a8a; font-size: 20px; }
  p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
  input[type="file"] { display: block; width: 100%; padding: 12px; border: 2px dashed #cbd5e1; border-radius: 10px; margin-bottom: 20px; background: #f8fafc; cursor: pointer; }
  input[type="file"]:active { border-color: #2563eb; background: #eff6ff; }
  button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #status { margin-top: 20px; font-weight: bold; text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; }
  .success { background: #d1fae5; color: #065f46; }
  .error { background: #fee2e2; color: #991b1b; }
  .info { background: #e0f2fe; color: #0369a1; }
</style>
</head>
<body>
  <div class="card">
    <h2>📁 Upload Traveler Folder</h2>
    <p id="target-info">Select a folder to upload.</p>
    
    <input type="file" id="folder-input" webkitdirectory directory multiple>
    <button id="upload-btn" onclick="upload()">Upload Folder</button>
    
    <div id="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const travelerId = params.get('traveler_id') || '';
    
    if (travelerId) {
      document.getElementById('target-info').innerHTML = `<b>Target Traveler:</b> ${travelerId}<br>Select the folder containing this traveler's files.`;
    }

    async function upload() {
      const input = document.getElementById('folder-input');
      const btn = document.getElementById('upload-btn');
      const status = document.getElementById('status');
      
      if (!input.files.length) { 
        alert('Please select a folder first.'); 
        return; 
      }
      
      btn.disabled = true;
      status.className = 'info';
      status.innerText = '⏳ Uploading... Please wait.';
      
      const fd = new FormData();
      if (travelerId) fd.append('traveler_id', travelerId);
      
      for (const file of input.files) {
        fd.append('files', file);
        fd.append('paths', file.webkitRelativePath);
      }
      
      try {
        const res = await fetch('/api/admin/traveler/upload-folder-html', {
          method: 'POST',
          body: fd
        });
        
        if (res.ok) {
          const data = await res.json();
          status.className = 'success';
          status.innerText = `✅ Upload successful! Uploaded ${data.count} files to ${data.folder}. You can close this tab.`;
        } else {
          const err = await res.text();
          status.className = 'error';
          status.innerText = '❌ Upload failed: ' + err;
          btn.disabled = false;
        }
      } catch (e) {
        status.className = 'error';
        status.innerText = '❌ Network error: ' + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
