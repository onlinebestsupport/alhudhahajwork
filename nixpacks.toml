# =================================================================================
# nixpacks.toml — Alhudha Haj Travel System (Railway deployment)
# =================================================================================

[phases.setup]
nixPkgs = [
    "python311",
    "libgtk-3",
]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r requirements.txt",
]

[start]
cmd = "python main.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"