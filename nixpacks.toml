# =================================================================================
# nixpacks.toml — Alhudha Haj Travel System (Railway deployment)
# =================================================================================
# Flet 1.0 web app. Runs as uvicorn/starlette — no desktop GUI needed.
# =================================================================================

[phases.setup]
nixPkgs = [
    "python311",
    "libgtk-3",     # safety net for flet-desktop import-time deps
]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r requirements.txt",
]

[start]
cmd = "python main.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"